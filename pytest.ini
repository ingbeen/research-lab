[pytest]
# pytest 설정 파일
# 이 파일은 pytest 실행 시 자동으로 로드되어 기본 동작을 설정합니다.

# 테스트 파일 검색 경로
testpaths = tests

# 리서치 산출물과 실행 로그는 수집 대상에서 제외한다.
# 에이전트가 회차마다 파일을 쌓는 폴더라, 수집 대상에 두면 그 안의 무엇이
# 테스트로 오인될 수 있고 수집 시간도 회차마다 늘어난다
norecursedirs = runs dossier ledger .venv

# 테스트 파일 패턴 (test_*.py 또는 *_test.py)
python_files = test_*.py

# 테스트 클래스 패턴 (Test로 시작)
python_classes = Test*

# 테스트 함수 패턴 (test_로 시작)
python_functions = test_*

# 최소 Python 버전 요구사항
minversion = 9.0

# 경고 표시 옵션
# error: 경고를 에러로 처리 (엄격 모드)
# ignore: 특정 경고 무시
# default: 기본 경고 표시
filterwarnings =
    # DeprecationWarning 표시 (경고는 확인)
    default::DeprecationWarning

# 출력 옵션
# -v: verbose (상세 출력)
# -ra: 모든 테스트 결과 요약 표시
# --tb=short: traceback을 짧게 표시
# --strict-markers: 등록되지 않은 마커 사용 시 에러
addopts =
    -ra
    --strict-markers
    --tb=short


# 로그 설정
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 커스텀 마커 정의 (필요 시)
markers =
    slow: 실행 시간이 오래 걸리는 테스트 (pytest -m "not slow"로 제외 가능)
    integration: 통합 테스트 (여러 모듈 결합 테스트)
    unit: 단위 테스트 (단일 함수/클래스 테스트)
    real_prober: 진짜 요청 경로(urllib)를 검사한다. conftest 의 네트워크 차단을 비켜 가므로,
        그 테스트는 urlopen 을 직접 갈아 끼워 밖으로 나가지 않는 것을 스스로 책임진다
