[tool.poetry]
name = "research-lab"
authors = ["Yubeen"]
version = "0.1.0"
description = "매매법 후보의 「재볼 가치가 있는가」를 근거 문서로 만드는 자율 리서치 파이프라인"
packages = [
    {include = "research_lab", from = "src"},
]

[tool.poetry.dependencies]
python = "~3.12"
# 런타임 의존성은 없다. 러너는 subprocess·json·pathlib·uuid·re 로 끝나고,
# 에이전트 호출은 `claude` CLI 를 부르는 것이라 SDK 가 필요 없다.
# 필요해지는 단계에서 그때 추가한다

[tool.poetry.group.dev.dependencies]
black = "^23.0.0"
ruff = "^0.8.0"
pytest = "^9.0.2"
pytest-cov = "^7.0.0"
pyright = "^1.1.407"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ['py312']

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long은 Black 스타일 존중
]

[tool.ruff.lint.isort]
known-first-party = ["research_lab"]

[tool.coverage.run]
omit = [
    "tests/*",
    "*/site-packages/*",
]

[tool.coverage.report]
show_missing = true
